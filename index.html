<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出差审批单 · 环江县驯乐苗族乡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'宋体',SimSun,serif;background:#d8d8d8;}
body{-webkit-text-size-adjust:100%;}

#app{display:flex;flex-direction:column;height:100vh;}
header{background:#1b3a5e;color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35);flex-shrink:0;z-index:100;gap:8px;flex-wrap:wrap;}
header h1{font-size:15px;font-weight:bold;letter-spacing:.5px;font-family:sans-serif;}
.main-layout{display:flex;flex:1;overflow:hidden;}

/* ===== Mobile Tabs ===== */
.mobile-tabs{
  display:none;
  background:#fff;
  padding:8px 10px;
  gap:8px;
  border-bottom:1px solid #d7dce2;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  z-index:90;
}
.mobile-tab{
  flex:1;
  border:none;
  border-radius:10px;
  padding:10px 12px;
  font-size:14px;
  font-family:sans-serif;
  background:#edf2f7;
  color:#334155;
  font-weight:bold;
  cursor:pointer;
}
.mobile-tab.active{background:#1b3a5e;color:#fff;}

/* ===== Editor ===== */
.editor{width:33.333vw;min-width:300px;max-width:480px;background:#f9f9f9;border-right:1px solid #ccc;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.editor-head{background:#2c5282;color:#fff;padding:10px 16px;font-size:15px;font-family:sans-serif;font-weight:bold;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px;flex-wrap:wrap;}
.editor-body{flex:1;overflow-y:auto;padding:14px;}
.editor-foot{padding:10px 14px;border-top:1px solid #ddd;background:#fff;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;}

.fg{margin-bottom:13px;}
.fg label{display:block;font-size:13px;color:#555;margin-bottom:5px;font-weight:bold;font-family:sans-serif;line-height:1.5;}
.fg input[type=text],.fg textarea,.fg select{
  width:100%;border:1px solid #bbb;border-radius:4px;padding:8px 10px;
  font-size:16px;font-family:'宋体',SimSun,serif;background:#fff;min-height:42px;
}
.fg textarea{height:90px;resize:vertical;}
.fg input[type=text]:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:#2c5282;box-shadow:0 0 0 2px rgba(44,82,130,.15);}
.date-row{display:flex;gap:3px;align-items:center;}
.date-row select{flex:1;min-width:0;}
.date-row span{font-size:13px;color:#555;white-space:nowrap;}
.auto-info{background:#eef2f7;border-radius:4px;padding:10px 12px;font-size:13px;color:#444;line-height:2;font-family:sans-serif;}
.auto-info b{color:#2c5282;}
.date-err{display:none;background:#fff5f5;border:1px solid #fc8181;border-radius:4px;padding:6px 10px;font-size:11px;color:#c53030;font-family:sans-serif;margin-bottom:8px;}

.dest-wrap{position:relative;}
.dest-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:13px;color:#666;padding:6px 8px;}
.dest-list{position:absolute;z-index:999;background:#fff;border:1px solid #bbb;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.12);max-height:180px;overflow-y:auto;top:100%;left:0;right:0;display:none;}
.dest-item{padding:10px 12px;cursor:pointer;font-size:14px;}
.dest-item:hover{background:#dbeafe;}

.tp-list{display:flex;flex-direction:column;gap:3px;}
.tp-item{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:6px;}
.tp-item:hover{background:#e8f0fe;}
.tp-item input[type=radio]{cursor:pointer;transform:scale(1.15);}
.tp-item label{cursor:pointer;font-size:14px;font-family:'宋体',SimSun,serif;}
.other-in{border:1px solid #bbb;border-radius:3px;padding:8px 6px;font-size:13px;font-family:'宋体',SimSun,serif;width:100%;margin-top:3px;display:none;min-height:40px;}
.other-in:focus{outline:none;border-color:#2c5282;}

/* ===== Preview ===== */
.preview{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;align-items:center;}
.preview-bar{width:794px;max-width:100%;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;background:#fff;padding:7px 12px;border-radius:4px;border:1px solid #ddd;font-family:sans-serif;gap:8px;flex-wrap:wrap;}
.preview-bar span{font-size:12px;color:#555;}
#pages-container{display:flex;flex-direction:column;align-items:center;gap:20px;}
.empty-hint{text-align:center;color:#aaa;font-size:13px;padding:40px;font-family:sans-serif;}

/* ===== A4 Page ===== */
.a4{width:794px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);}
.a4-inner{padding:0 38px;min-height:1122px;display:flex;flex-direction:column;}

/* ===== 虚线剪裁线 ===== */
.cut-line,.cut-line-mid{
  border:none;border-top:1px dashed #666;flex-shrink:0;position:relative;
}
.cut-line{margin:0;}
.cut-line-mid{margin:4px 0;}
.cut-line::before,.cut-line-mid::before{
  content:'✂';position:absolute;top:-9px;left:-30px;font-size:12px;color:#888;background:#fff;padding-right:2px;
}

/* ===== Form Card ===== */
.form-card{flex:1;position:relative;padding:17px 0 15px 0;}
.form-card.drag-over{outline:2px dashed #2c5282;outline-offset:2px;}
.form-card-actions{position:absolute;top:20px;right:0;display:flex;gap:4px;z-index:10;}
.form-card:hover .form-card-actions{display:flex;}

/* ===== 文档 ===== */
.doc-title{
  text-align:center;font-size:20pt;
  font-family:'方正小标宋简体','FangZhengXiaoBiaoSongJianTi','SimHei','黑体',serif;
  font-weight:normal;line-height:1.8;letter-spacing:1px;margin:0;
}
.doc-unit-row{
  font-size:12pt;font-family:'宋体',SimSun,serif;line-height:1.6;
  display:flex;justify-content:space-between;align-items:baseline;
}
.doc-unit-left,.doc-unit-right{white-space:nowrap;}
.doc-tbl{
  width:100%;border-collapse:collapse;font-size:12pt;font-family:'宋体',SimSun,serif;
  table-layout:fixed;margin:0;
}
.doc-tbl td{
  border:1px solid #000;padding:2px 5px;vertical-align:middle;
  font-size:12pt;font-family:'宋体',SimSun,serif;line-height:1.5;
}
.doc-tbl .col-h{width:19.65%;text-align:center;vertical-align:middle;white-space:nowrap;}
.doc-tbl .col-l{text-align:left;vertical-align:middle;}
.doc-tbl .col-c{text-align:center;vertical-align:middle;}
.doc-tbl .leader-cell{vertical-align:top;padding:3px 8px;line-height:2.2;text-align:left;}
.leader-date{text-align:right;display:block;}

.tp-row{
  display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;
  font-size:12pt;font-family:'宋体',SimSun,serif;white-space:nowrap;gap:0;
}
.tp-seg{white-space:nowrap;cursor:pointer;user-select:none;padding:0 1px;}
.tp-seg:hover{color:#2c5282;}
.other-inline{
  border:none;border-bottom:1px solid #000;background:transparent;
  font-size:12pt;font-family:'宋体',SimSun,serif;
  width:90px;outline:none;padding:0 2px;vertical-align:middle;
}
.other-inline:focus{background:rgba(254,249,219,.6);}
.other-blank{display:inline-block;width:90px;border-bottom:1px solid #000;vertical-align:middle;margin-left:1px;}

.idest-wrap{position:relative;display:inline;}
.idest-list{
  position:absolute;z-index:300;background:#fff;border:1px solid #bbb;border-radius:4px;
  box-shadow:0 4px 12px rgba(0,0,0,.15);max-height:160px;overflow-y:auto;
  top:100%;left:0;min-width:110px;display:none;
}
.idest-opt{padding:4px 10px;cursor:pointer;font-size:11pt;white-space:nowrap;}
.idest-opt:hover{background:#dbeafe;}

[contenteditable]{outline:none;cursor:text;}
[contenteditable]:hover{background:rgba(219,234,254,.2);}
[contenteditable]:focus{background:rgba(254,249,219,.7);outline:1px dashed #e8a000;}
.ph:empty::before{content:attr(data-ph);color:#bbb;pointer-events:none;}
.doc-note{font-size:12pt;font-family:'宋体',SimSun,serif;line-height:1.6;text-align:left;margin-top:1px;}

/* ===== Buttons ===== */
.btn{padding:7px 14px;border-radius:4px;border:none;cursor:pointer;font-size:12px;font-family:sans-serif;transition:all .15s;white-space:nowrap;min-height:40px;}
.btn-p{background:#1b3a5e;color:#fff;}.btn-p:hover{background:#2c5282;}
.btn-s{background:#fff;color:#333;border:1px solid #bbb;}.btn-s:hover{background:#f0f0f0;}
.btn-g{background:#276749;color:#fff;}.btn-g:hover{background:#2f855a;}
.btn-d{background:#c53030;color:#fff;font-size:11px;padding:3px 8px;}.btn-d:hover{background:#9b2c2c;}
.btn-w{background:#d69e2e;color:#fff;}.btn-w:hover{background:#b7791f;}
.btn-sm{padding:3px 9px;font-size:11px;min-height:34px;}
.btn-icon{background:#4a5568;color:#fff;font-size:11px;padding:3px 8px;cursor:grab;}

/* ===== 状态条 ===== */
.status-bar{
  background:#edf2f7;border-bottom:1px solid #d9e2ec;
  padding:8px 12px;font-size:12px;color:#4a5568;font-family:sans-serif;
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
}
.status-bar b{color:#1b3a5e;}

/* ===== Modal ===== */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;justify-content:center;align-items:center;}
.modal-bg.on{display:flex;}
.modal{background:#fff;border-radius:8px;padding:24px;max-width:420px;width:92%;box-shadow:0 8px 32px rgba(0,0,0,.22);}
.modal h3{font-size:15px;margin-bottom:10px;font-family:sans-serif;color:#c53030;}
.modal p{font-size:13px;color:#555;line-height:1.7;font-family:sans-serif;}
.modal-foot{margin-top:18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}

.editor-body::-webkit-scrollbar,.preview::-webkit-scrollbar{width:5px;}
.editor-body::-webkit-scrollbar-thumb,.preview::-webkit-scrollbar-thumb{background:#bbb;border-radius:4px;}

.author-tip{
  display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;
  background:rgba(255,255,255,0.18);color:rgba(255,255,255,0.45);font-size:10px;font-style:normal;
  font-family:sans-serif;cursor:default;line-height:1;vertical-align:middle;margin-left:4px;
}
.author-tip:hover{color:rgba(255,255,255,0.9);background:rgba(255,255,255,0.28);}

/* ===== 平板和小屏优化 ===== */
@media (max-width:1024px){
  .editor{width:42vw;min-width:280px;}
  .preview{padding:12px;}
  .preview-bar{width:100%;}
  .a4{width:100%;max-width:794px;}
}

/* ===== 手机端 ===== */
@media (max-width:768px){
  html,body{height:auto;background:#eef1f5;}
  #app{height:auto;min-height:100vh;}
  header{padding:10px 12px;align-items:flex-start;}
  header h1{font-size:13px;line-height:1.4;width:100%;}
  .mobile-tabs{display:flex;position:sticky;top:0;}
  .main-layout{display:block;overflow:visible;}
  .editor,.preview{width:100%;max-width:none;min-width:0;border-right:none;}
  .editor{display:flex;background:#f9fafb;}
  .editor-head{padding:12px 14px;font-size:14px;}
  .editor-body{padding:12px;overflow:visible;}
  .editor-foot{
    padding:10px 12px 14px;position:sticky;bottom:0;background:rgba(255,255,255,.96);
    backdrop-filter:blur(6px);box-shadow:0 -2px 10px rgba(0,0,0,.06);
  }
  .preview{display:none;padding:10px 10px 20px;overflow:visible;align-items:stretch;}
  .preview.mobile-active{display:flex;}
  .editor.mobile-hidden{display:none;}
  .preview-bar{
    width:100%;margin-bottom:10px;padding:10px 12px;
    flex-direction:column;align-items:flex-start;gap:8px;
  }
  .preview-bar > div{width:100%;display:flex;gap:8px;flex-wrap:wrap;}
  .preview-bar .btn{flex:1;}
  #pages-container{gap:14px;align-items:stretch;}
  .a4{width:100%;max-width:100%;overflow:hidden;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .a4-inner{min-height:auto;padding:12px 12px;}
  .cut-line::before,.cut-line-mid::before{left:-16px;}
  .form-card{padding:12px 0 10px 0;}
  .form-card-actions{position:static;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .btn-icon{display:none;}
  .doc-title{font-size:16px;line-height:1.5;margin-bottom:4px;}
  .doc-unit-row{font-size:12px;line-height:1.6;flex-direction:column;align-items:flex-start;gap:2px;}
  .doc-unit-left,.doc-unit-right{white-space:normal;font-size:12px;}
  .doc-tbl td{font-size:12px;line-height:1.45;padding:4px 5px;word-break:break-all;}
  .doc-tbl .col-h{white-space:normal;width:24%;}
  .tp-row{flex-wrap:wrap;justify-content:flex-start;gap:4px 6px;white-space:normal;font-size:12px;}
  .tp-seg{display:inline-block;}
  .other-inline,.other-blank{width:88px;font-size:12px;}
  .idest-list{min-width:96px;max-width:180px;}
  .idest-opt{padding:8px 10px;font-size:12px;}
  .doc-note{font-size:12px;margin-top:4px;}
  .empty-hint{padding:30px 14px;font-size:13px;background:#fff;border-radius:10px;border:1px solid #e5e7eb;}
}
@media (max-width:420px){
  header h1{font-size:12px;}
  .editor-head{font-size:13px;}
  .btn{padding:9px 10px;font-size:12px;}
  .doc-title{font-size:15px;}
  .doc-tbl td{font-size:11px;padding:4px 4px;}
  .doc-tbl .col-h{width:26%;}
}

/* ===== 打印 ===== */
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  @page{size:A4;margin:0;}
  body{background:#fff;}
  #app{display:block;height:auto;}
  header,.editor,.preview-bar,.form-card-actions,.empty-hint,.mobile-tabs,.status-bar{display:none!important;}
  .preview{padding:0;overflow:visible;display:block!important;}
  #pages-container{gap:0;align-items:stretch;display:block;}
  .a4{width:210mm;box-shadow:none;page-break-after:always;break-after:page;border-radius:0;}
  .a4:last-child{page-break-after:avoid;break-after:avoid;}
  .a4-inner{padding:0 1cm;min-height:0;}
  .cut-line,.cut-line-mid{border-top:1px dashed #666;}
  .cut-line::before,.cut-line-mid::before{left:-0.8cm;}
  [contenteditable]:hover,[contenteditable]:focus{background:transparent;outline:none;}
  .tp-seg:hover{color:inherit;}
  .idest-list,.date-err{display:none!important;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏛️ 出差审批单管理系统 · 环江县驯乐苗族乡人民政府</h1>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="btn btn-g" onclick="exportPDF()">🖨️ 导出 PDF</button>
      <button class="btn btn-w" onclick="confirmClearData()">🧹 清空本机数据</button>
      <span class="author-tip" title="作者：韦彬">ℹ</span>
    </div>
  </header>

  <div class="status-bar">
    <div>自动保存状态：<b id="saveState">未保存</b></div>
    <div>说明：数据只保存在<b>当前设备浏览器</b>里，不会上传给别人</div>
  </div>

  <div class="mobile-tabs" id="mobileTabs">
    <button class="mobile-tab active" id="tabEdit" type="button" onclick="switchMobileView('edit')">填写</button>
    <button class="mobile-tab" id="tabPreview" type="button" onclick="switchMobileView('preview')">预览</button>
  </div>

  <div class="main-layout">
    <div class="editor" id="editorPanel">
      <div class="editor-head">
        <span id="edTitle">📝 新建审批单</span>
        <span id="edBadge" style="font-size:12px;opacity:.75;"></span>
      </div>
      <div class="editor-body">
        <div class="fg">
          <label>出差人姓名 <span style="color:#e53e3e;font-size:11px;">（填后自动同步至新单）</span></label>
          <input type="text" id="fName" placeholder="请输入出差人姓名" oninput="sharedName=this.value;saveAll()">
        </div>
        <div class="fg">
          <label>出差事由</label>
          <textarea id="fReason" placeholder="例：到县教育局参加控辍保学工作会议/到福寿社区板要屯开展耕地保护工作" oninput="saveAll()"></textarea>
        </div>
        <div class="fg">
          <label>出差开始日期</label>
          <div class="date-row">
            <select id="sY" onchange="onStartChange();saveAll()"></select><span>年</span>
            <select id="sM" onchange="onStartChange();saveAll()"></select><span>月</span>
            <select id="sD" onchange="onStartChange();saveAll()"></select><span>日</span>
          </div>
        </div>
        <div class="fg">
          <label>出差结束日期 <span style="color:#718096;font-size:11px;">（默认同步开始日期，可单独修改）</span></label>
          <div class="date-row">
            <select id="eY" onchange="calcDates();saveAll()"></select><span>年</span>
            <select id="eM" onchange="calcDates();updateDays('e');saveAll()"></select><span>月</span>
            <select id="eD" onchange="calcDates();saveAll()"></select><span>日</span>
          </div>
        </div>
        <div class="date-err" id="dateErrTip">⚠ 出差结束日期不能早于开始日期，已自动纠正为相同日期。</div>
        <div class="fg">
          <div class="auto-info">
            出差天数：<b id="cDays">--</b> 天<br>
            审批日期（比出发提前一天）：<b id="cApproval">--</b>
          </div>
        </div>
        <div class="fg">
          <label>出发地（默认：驯乐乡府）</label>
          <input type="text" id="fOrigin" value="驯乐乡府" oninput="saveAll()">
        </div>
        <div class="fg">
          <label>目的地 <span style="color:#718096;font-size:11px;">（可从列表选择或直接输入）</span></label>
          <div class="dest-wrap">
            <input type="text" id="fDest" placeholder="请选择或输入目的地" autocomplete="off" onfocus="showDestList()" oninput="filterDestList(this.value);saveAll()">
            <button class="dest-btn" onclick="toggleDestList()" type="button">▼</button>
            <div class="dest-list" id="destList"></div>
          </div>
        </div>
        <div class="fg">
          <label>乘坐交通工具</label>
          <div class="tp-list">
            <label class="tp-item"><input type="radio" name="tp" value="1"><label>1.飞机（　）</label></label>
            <label class="tp-item"><input type="radio" name="tp" value="2"><label>2.火车（　）</label></label>
            <label class="tp-item"><input type="radio" name="tp" value="3"><label>3.汽车（　）</label></label>
            <label class="tp-item"><input type="radio" name="tp" value="4"><label>4.单位公务车（　）</label></label>
            <label class="tp-item"><input type="radio" name="tp" value="5"><label>5.其他（横线填写）</label></label>
            <input type="text" class="other-in" id="fOther" placeholder="请输入其他交通工具名称" oninput="saveAll()">
          </div>
        </div>
      </div>
      <div class="editor-foot">
        <button class="btn btn-p" style="flex:1;" onclick="submitForm()"><span id="addBtn">✚ 添加到审批单</span></button>
        <button class="btn btn-s" id="cancelBtn" onclick="cancelEdit()" style="display:none;">取消</button>
      </div>
    </div>

    <div class="preview" id="previewPanel">
      <div class="preview-bar">
        <span id="cntLabel">共 0 个审批单，0 页</span>
        <div>
          <button class="btn btn-s btn-sm" type="button" onclick="switchMobileView('edit')">← 返回填写</button>
          <button class="btn btn-s btn-sm" type="button" onclick="document.getElementById('previewPanel').scrollTop=0">↑ 顶部</button>
          <button class="btn btn-s btn-sm" type="button" onclick="document.getElementById('previewPanel').scrollTop=99999">↓ 底部</button>
        </div>
      </div>
      <div id="pages-container"></div>
      <div class="empty-hint" id="emptyHint">请填写出差信息，点击「添加到审批单」生成表格<br><br>每页可容纳 2 个审批单 · 电脑端支持拖动排序 · 支持自动保存 · 可导出 PDF</div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle">⚠ 提示</h3>
    <p id="modalMsg"></p>
    <div class="modal-foot" id="modalFoot">
      <button class="btn btn-p" onclick="closeModal()">确 定</button>
    </div>
  </div>
</div>

<script>
const DESTS=['环江县城','福寿社区','平治社区','北山村','大吉村','顺宁村','康宁村','全安村','平莫村','太平村','镇北村','长北村','山岗村','金城江区','宜州区','南宁市'];
const TP_NAMES=['飞机','火车','汽车','单位公务车'];
const STORE_KEY='xunle_chuchai_forms_v2';
const EDITOR_KEY='xunle_chuchai_editor_v2';

let forms=[], sharedName='', editingId=null, dragSrc=null;
let mobileView='edit';
let saveTimer=null;

function isMobileView(){ return window.innerWidth <= 768; }

function setSaveState(txt){
  const el=document.getElementById('saveState');
  if(el) el.textContent=txt;
}

function switchMobileView(view){
  mobileView=view;
  const editor=document.getElementById('editorPanel');
  const preview=document.getElementById('previewPanel');
  const tabEdit=document.getElementById('tabEdit');
  const tabPreview=document.getElementById('tabPreview');
  if(!editor || !preview || !tabEdit || !tabPreview) return;

  if(view==='preview'){
    editor.classList.add('mobile-hidden');
    preview.classList.add('mobile-active');
    tabPreview.classList.add('active');
    tabEdit.classList.remove('active');
  }else{
    editor.classList.remove('mobile-hidden');
    preview.classList.remove('mobile-active');
    tabEdit.classList.add('active');
    tabPreview.classList.remove('active');
  }
  setTimeout(scalePreviewForMobile,60);
}

function applyResponsiveMode(){
  const editor=document.getElementById('editorPanel');
  const preview=document.getElementById('previewPanel');
  if(!editor || !preview) return;

  if(isMobileView()) switchMobileView(mobileView || 'edit');
  else{
    editor.classList.remove('mobile-hidden');
    preview.classList.remove('mobile-active');
  }
  scalePreviewForMobile();
}

function scalePreviewForMobile(){
  if(!isMobileView()) return;
  document.querySelectorAll('.a4').forEach(a4=>{
    a4.style.transform='';
    a4.style.transformOrigin='';
  });
}

(function init(){
  const now=new Date();
  fillYear('sY',now.getFullYear()); fillYear('eY',now.getFullYear());
  fillMonth('sM',now.getMonth()+1); fillMonth('eM',now.getMonth()+1);
  fillDays('sD',now.getFullYear(),now.getMonth()+1,now.getDate());
  fillDays('eD',now.getFullYear(),now.getMonth()+1,now.getDate());
  calcDates();

  const dl=document.getElementById('destList');
  DESTS.forEach(d=>{
    const div=document.createElement('div');
    div.className='dest-item';
    div.textContent=d;
    div.onmousedown=()=>{
      document.getElementById('fDest').value=d;
      dl.style.display='none';
      saveAll();
    };
    dl.appendChild(div);
  });

  document.querySelectorAll('input[name=tp]').forEach(r=>{
    r.addEventListener('change',()=>{
      document.getElementById('fOther').style.display=r.value==='5'?'block':'none';
      if(r.value!=='5') document.getElementById('fOther').value='';
      saveAll();
    });
  });

  document.addEventListener('click',e=>{
    const dw=document.querySelector('.dest-wrap');
    if(dw && !dw.contains(e.target)){
      document.getElementById('destList').style.display='none';
    }
  });

  loadAll();
  applyResponsiveMode();
  window.addEventListener('resize',applyResponsiveMode);
})();

function fillYear(id,sel){
  const s=document.getElementById(id); s.innerHTML='';
  for(let y=2020;y<=2035;y++){
    const o=document.createElement('option'); o.value=y; o.text=y;
    if(y===sel) o.selected=true;
    s.appendChild(o);
  }
}
function fillMonth(id,sel){
  const s=document.getElementById(id); s.innerHTML='';
  for(let m=1;m<=12;m++){
    const o=document.createElement('option'); o.value=m; o.text=m;
    if(m===sel) o.selected=true;
    s.appendChild(o);
  }
}
function fillDays(id,y,m,sel){
  const s=document.getElementById(id);
  const cur=parseInt(s.value)||sel;
  const max=new Date(y,m,0).getDate();
  s.innerHTML='';
  for(let d=1;d<=max;d++){
    const o=document.createElement('option'); o.value=d; o.text=d;
    if(d===Math.min(cur,max)) o.selected=true;
    s.appendChild(o);
  }
}
function updateDays(w){
  if(w==='s'){
    const y=+document.getElementById('sY').value,m=+document.getElementById('sM').value;
    fillDays('sD',y,m,+document.getElementById('sD').value);
  }else{
    const y=+document.getElementById('eY').value,m=+document.getElementById('eM').value;
    fillDays('eD',y,m,+document.getElementById('eD').value);
  }
  calcDates();
}

function onStartChange(){
  const sy=+document.getElementById('sY').value;
  const sm=+document.getElementById('sM').value;
  const sd=+document.getElementById('sD').value;
  updateDays('s');
  fillYear('eY',sy);
  fillMonth('eM',sm);
  fillDays('eD',sy,sm,sd);
  calcDates();
}

function calcDates(){
  const sy=+document.getElementById('sY').value, sm=+document.getElementById('sM').value, sd=+document.getElementById('sD').value;
  const ey=+document.getElementById('eY').value, em=+document.getElementById('eM').value, ed=+document.getElementById('eD').value;
  const s=new Date(sy,sm-1,sd), e=new Date(ey,em-1,ed);

  const tip=document.getElementById('dateErrTip');
  let end=e;
  if(e<s){
    fillYear('eY',sy);
    fillMonth('eM',sm);
    fillDays('eD',sy,sm,sd);
    end=new Date(s);
    tip.style.display='block';
    setTimeout(()=>tip.style.display='none',1800);
  }else{
    tip.style.display='none';
  }

  const days=Math.max(1,Math.round((end-s)/864e5)+1);
  document.getElementById('cDays').textContent=days;
  const apr=new Date(s); apr.setDate(apr.getDate()-1);
  document.getElementById('cApproval').textContent=`${apr.getFullYear()}年${apr.getMonth()+1}月${apr.getDate()}日`;
}

function showDestList(){ filterDestList(document.getElementById('fDest').value); }
function toggleDestList(){
  const dl=document.getElementById('destList');
  dl.style.display=dl.style.display==='block'?'none':'block';
  if(dl.style.display==='block') filterDestList(document.getElementById('fDest').value);
}
function filterDestList(v){
  const dl=document.getElementById('destList');
  dl.style.display='block';
  dl.querySelectorAll('.dest-item').forEach(el=>{
    el.style.display=(!v || el.textContent.includes(v))?'block':'none';
  });
}

function getEditorData(){
  const sy=+document.getElementById('sY').value, sm=+document.getElementById('sM').value, sd=+document.getElementById('sD').value;
  const ey=+document.getElementById('eY').value, em=+document.getElementById('eM').value, ed=+document.getElementById('eD').value;
  const s=new Date(sy,sm-1,sd), e=new Date(ey,em-1,ed);
  const days=Math.max(1,Math.round((e-s)/864e5)+1);
  const apr=new Date(s); apr.setDate(apr.getDate()-1);
  const tp=document.querySelector('input[name=tp]:checked');
  return{
    id:editingId||('f'+Date.now()),
    name:document.getElementById('fName').value.trim(),
    reason:document.getElementById('fReason').value.trim(),
    sY:sy,sM:sm,sD:sd,eY:ey,eM:em,eD:ed,days,
    aprY:apr.getFullYear(),aprM:apr.getMonth()+1,aprD:apr.getDate(),
    origin:document.getElementById('fOrigin').value.trim()||'驯乐乡府',
    dest:document.getElementById('fDest').value.trim(),
    tp:tp?+tp.value:0,
    tpOther:document.getElementById('fOther').value.trim()
  };
}

function getEditorDraft(){
  const tp=document.querySelector('input[name=tp]:checked');
  return{
    sharedName:sharedName||'',
    editingId:editingId||null,
    fName:document.getElementById('fName').value||'',
    fReason:document.getElementById('fReason').value||'',
    sY:+document.getElementById('sY').value,
    sM:+document.getElementById('sM').value,
    sD:+document.getElementById('sD').value,
    eY:+document.getElementById('eY').value,
    eM:+document.getElementById('eM').value,
    eD:+document.getElementById('eD').value,
    fOrigin:document.getElementById('fOrigin').value||'驯乐乡府',
    fDest:document.getElementById('fDest').value||'',
    tp:tp?+tp.value:0,
    fOther:document.getElementById('fOther').value||'',
    mobileView:mobileView||'edit'
  };
}

function applyEditorDraft(d){
  if(!d) return;
  sharedName=d.sharedName||'';
  editingId=d.editingId||null;

  document.getElementById('fName').value=d.fName||sharedName||'';
  document.getElementById('fReason').value=d.fReason||'';
  document.getElementById('fOrigin').value=d.fOrigin||'驯乐乡府';
  document.getElementById('fDest').value=d.fDest||'';

  fillYear('sY',d.sY||new Date().getFullYear());
  fillMonth('sM',d.sM||1);
  fillDays('sD',d.sY||new Date().getFullYear(),d.sM||1,d.sD||1);

  fillYear('eY',d.eY||d.sY||new Date().getFullYear());
  fillMonth('eM',d.eM||d.sM||1);
  fillDays('eD',d.eY||d.sY||new Date().getFullYear(),d.eM||d.sM||1,d.eD||1);

  document.querySelectorAll('input[name=tp]').forEach(r=>{
    r.checked=(+r.value===+(d.tp||0));
  });
  const ot=document.getElementById('fOther');
  ot.value=d.fOther||'';
  ot.style.display=+(d.tp||0)===5?'block':'none';

  if(editingId){
    const idx=forms.findIndex(x=>x.id===editingId);
    document.getElementById('edTitle').textContent='✏️ 编辑审批单';
    document.getElementById('edBadge').textContent=idx>-1?`第 ${idx+1} 条`:'';
    document.getElementById('addBtn').textContent='💾 保存修改';
    document.getElementById('cancelBtn').style.display='inline-block';
  }else{
    finishEdit();
    document.getElementById('fName').value=d.fName||sharedName||'';
  }

  mobileView=d.mobileView||'edit';
  calcDates();
}

function saveFormsOnly(){
  localStorage.setItem(STORE_KEY, JSON.stringify(forms));
}

function saveEditorOnly(){
  localStorage.setItem(EDITOR_KEY, JSON.stringify(getEditorDraft()));
}

function saveAll(immediate=false){
  setSaveState('保存中...');
  if(immediate){
    saveFormsOnly();
    saveEditorOnly();
    setSaveState('已自动保存');
    return;
  }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    saveFormsOnly();
    saveEditorOnly();
    setSaveState('已自动保存');
  },180);
}

function loadAll(){
  try{
    const savedForms=localStorage.getItem(STORE_KEY);
    const savedEditor=localStorage.getItem(EDITOR_KEY);

    if(savedForms){
      const parsed=JSON.parse(savedForms);
      if(Array.isArray(parsed)) forms=parsed;
    }
    renderPreview();

    if(savedEditor){
      const draft=JSON.parse(savedEditor);
      applyEditorDraft(draft);
    }else{
      resetEditor(false);
    }

    if(forms.length || savedEditor){
      setSaveState('已读取本机数据');
    }else{
      setSaveState('未保存');
    }
  }catch(e){
    console.error(e);
    setSaveState('读取失败');
  }
}

function submitForm(){
  const d=getEditorData(), miss=[];
  if(!d.name) miss.push('出差人姓名');
  if(!d.reason) miss.push('出差事由');
  if(!d.dest) miss.push('目的地');
  if(!d.tp) miss.push('乘坐交通工具');
  if(d.tp===5 && !d.tpOther) miss.push('其他交通工具名称');

  if(miss.length){
    showAlert('⚠ 信息不完整','请补充以下内容：<br>'+miss.map(x=>'• '+x).join('<br>'));
    return;
  }

  if(editingId){
    const idx=forms.findIndex(f=>f.id===editingId);
    if(idx>-1) forms[idx]=d;
    finishEdit();
  }else{
    forms.push(d);
  }

  sharedName=d.name;
  renderPreview();
  resetEditor(false);
  saveAll(true);
  if(isMobileView()) switchMobileView('preview');
}

function cancelEdit(){
  finishEdit();
  resetEditor(false);
  saveAll(true);
}

function finishEdit(){
  editingId=null;
  document.getElementById('edTitle').textContent='📝 新建审批单';
  document.getElementById('addBtn').textContent='✚ 添加到审批单';
  document.getElementById('cancelBtn').style.display='none';
  document.getElementById('edBadge').textContent='';
}

function resetEditor(save=true){
  document.getElementById('fReason').value='';
  document.getElementById('fOrigin').value='驯乐乡府';
  document.getElementById('fDest').value='';
  document.querySelectorAll('input[name=tp]').forEach(r=>r.checked=false);
  document.getElementById('fOther').value='';
  document.getElementById('fOther').style.display='none';
  document.getElementById('fName').value=sharedName||'';

  const now=new Date();
  fillYear('sY',now.getFullYear());
  fillMonth('sM',now.getMonth()+1);
  fillDays('sD',now.getFullYear(),now.getMonth()+1,now.getDate());
  fillYear('eY',now.getFullYear());
  fillMonth('eM',now.getMonth()+1);
  fillDays('eD',now.getFullYear(),now.getMonth()+1,now.getDate());
  calcDates();

  if(save) saveAll();
}

function editForm(id){
  const f=forms.find(x=>x.id===id); if(!f) return;
  editingId=id;
  const idx=forms.findIndex(x=>x.id===id);

  document.getElementById('edTitle').textContent='✏️ 编辑审批单';
  document.getElementById('edBadge').textContent=`第 ${idx+1} 条`;
  document.getElementById('addBtn').textContent='💾 保存修改';
  document.getElementById('cancelBtn').style.display='inline-block';

  document.getElementById('fName').value=f.name;
  sharedName=f.name;
  document.getElementById('fReason').value=f.reason;
  document.getElementById('fOrigin').value=f.origin;
  document.getElementById('fDest').value=f.dest;
  fillYear('sY',f.sY); fillMonth('sM',f.sM); fillDays('sD',f.sY,f.sM,f.sD);
  fillYear('eY',f.eY); fillMonth('eM',f.eM); fillDays('eD',f.eY,f.eM,f.eD);
  document.querySelectorAll('input[name=tp]').forEach(r=>{ r.checked=+r.value===f.tp; });
  const ot=document.getElementById('fOther');
  ot.style.display=f.tp===5?'block':'none';
  ot.value=f.tpOther||'';
  calcDates();

  const eb=document.querySelector('.editor-body');
  if(eb) eb.scrollTop=0;
  saveAll(true);
  if(isMobileView()) switchMobileView('edit');
}

function deleteForm(id){
  forms=forms.filter(f=>f.id!==id);
  if(editingId===id) cancelEdit();
  renderPreview();
  saveAll(true);
}

function showAlert(title,msg){
  document.getElementById('modalTitle').innerHTML=title||'⚠ 提示';
  document.getElementById('modalMsg').innerHTML=msg||'';
  document.getElementById('modalFoot').innerHTML='<button class="btn btn-p" onclick="closeModal()">确 定</button>';
  document.getElementById('modal').classList.add('on');
}
function closeModal(){
  document.getElementById('modal').classList.remove('on');
}

function confirmClearData(){
  document.getElementById('modalTitle').innerHTML='🧹 清空本机数据';
  document.getElementById('modalMsg').innerHTML='确定要清空当前设备浏览器保存的全部出差审批数据吗？<br><br><b style="color:#c53030;">清空后无法恢复。</b>';
  document.getElementById('modalFoot').innerHTML=`
    <button class="btn btn-s" onclick="closeModal()">取消</button>
    <button class="btn btn-d" onclick="clearLocalData()">确认清空</button>
  `;
  document.getElementById('modal').classList.add('on');
}

function clearLocalData(){
  localStorage.removeItem(STORE_KEY);
  localStorage.removeItem(EDITOR_KEY);
  forms=[];
  sharedName='';
  editingId=null;
  finishEdit();
  resetEditor(false);
  renderPreview();
  mobileView='edit';
  applyResponsiveMode();
  setSaveState('本机数据已清空');
  closeModal();
}

function renderPreview(){
  const c=document.getElementById('pages-container');
  c.innerHTML='';
  document.getElementById('emptyHint').style.display=forms.length?'none':'block';

  const pageCount=Math.max(1,Math.ceil(forms.length/2));
  document.getElementById('cntLabel').textContent=`共 ${forms.length} 个审批单，${forms.length?pageCount:0} 页`;

  for(let i=0;i<forms.length;i+=2){
    const pg=document.createElement('div');
    pg.className='a4';
    const inn=document.createElement('div');
    inn.className='a4-inner';

    inn.appendChild(makeCutLine('cut-line'));
    inn.appendChild(makeCard(forms[i],i));

    if(forms[i+1]){
      inn.appendChild(makeCutLine('cut-line-mid'));
      inn.appendChild(makeCard(forms[i+1],i+1));
      inn.appendChild(makeCutLine('cut-line'));
    }else{
      const sp=document.createElement('div');
      sp.style.flex='1';
      inn.appendChild(sp);
      inn.appendChild(makeCutLine('cut-line'));
    }

    pg.appendChild(inn);
    c.appendChild(pg);
  }
  setupDrag();
  applyResponsiveMode();
}

function makeCutLine(cls){
  const d=document.createElement('div');
  d.className=cls||'cut-line';
  return d;
}

function makeCard(f, idx){
  const card=document.createElement('div');
  card.className='form-card';
  card.dataset.id=f.id;
  card.dataset.idx=idx;
  card.setAttribute('draggable', isMobileView() ? 'false' : 'true');

  const aprStr=`${f.aprY} 年 ${f.aprM} 月 ${f.aprD} 日`;
  const sStr=`${f.sY} 年 ${f.sM} 月 ${f.sD} 日`;
  const eStr=`${f.eY} 年 ${f.eM} 月 ${f.eD} 日`;

  let tpHtml='<div class="tp-row">';
  for(let i=1;i<=4;i++){
    const mk=f.tp===i?'✓':' ';
    tpHtml+=`<span class="tp-seg" onclick="toggleTp('${f.id}',${i})">${i}.${TP_NAMES[i-1]}（${mk}）</span>`;
  }
  tpHtml+=`<span class="tp-seg" onclick="toggleTp('${f.id}',5)">5.其他</span>`;
  if(f.tp===5){
    tpHtml+=`<input class="other-inline" value="${esc(f.tpOther||'')}"
           oninput="updateField('${f.id}','tpOther',this.value)"
           onclick="event.stopPropagation()">`;
  }else{
    tpHtml+=`<span class="other-blank"></span>`;
  }
  tpHtml+='</div>';

  const destOpts=DESTS.map(d=>`<div class="idest-opt" onmousedown="pickDest('${f.id}','${d}')">${d}</div>`).join('');

  card.innerHTML=`
    <div class="form-card-actions">
      <button class="btn btn-sm btn-s" onclick="editForm('${f.id}')">✏️ 编辑</button>
      <button class="btn btn-sm btn-d" onclick="deleteForm('${f.id}')">✕ 删除</button>
      <span class="btn btn-icon" title="拖动排序">⠿</span>
    </div>
    <div class="doc-title">环江县驯乐苗族乡人民政府出差审批单</div>
    <div class="doc-unit-row">
      <span class="doc-unit-left">单位 (部门) ：驯乐苗族乡人民政府</span>
      <span class="doc-unit-right">${aprStr}</span>
    </div>
    <table class="doc-tbl">
      <colgroup>
        <col style="width:19.65%">
        <col style="width:80.35%">
      </colgroup>
      <tr>
        <td class="col-h">出差人姓名</td>
        <td class="col-l">
          <span class="ph" contenteditable="true"
            data-ph="请输入出差人姓名"
            onblur="updateField('${f.id}','name',this.textContent.trim())"
          >${esc(f.name)}</span>
        </td>
      </tr>
      <tr>
        <td class="col-h">出差事由</td>
        <td class="col-l">
          <span class="ph" contenteditable="true"
            data-ph="例：到县教育局参加控辍保学工作会议/到福寿社区板要屯开展耕地保护工作"
            onblur="updateField('${f.id}','reason',this.textContent.trim())"
          >${esc(f.reason)}</span>
        </td>
      </tr>
      <tr>
        <td class="col-h">出差时间</td>
        <td class="col-c">${sStr}至${eStr}，共&nbsp;&nbsp;${f.days}&nbsp;&nbsp;天</td>
      </tr>
      <tr>
        <td class="col-h">出差地点线路</td>
        <td class="col-c">
          <span class="ph" contenteditable="true" data-ph="出发地"
            onblur="updateField('${f.id}','origin',this.textContent.trim())"
          >${esc(f.origin)}</span>⇋<span class="idest-wrap">
            <span class="ph" contenteditable="true" data-ph="目的地"
              id="df_${f.id}"
              onfocus="showIdest('${f.id}')"
              onblur="updateField('${f.id}','dest',this.textContent.trim());hideIdest('${f.id}')"
            >${esc(f.dest)}</span>
            <div class="idest-list" id="idest_${f.id}">${destOpts}</div>
          </span>
        </td>
      </tr>
      <tr>
        <td class="col-h">乘坐交通工具</td>
        <td class="col-c">${tpHtml}</td>
      </tr>
      <tr>
        <td colspan="2" class="leader-cell">
          <div>领导审批意见：</div>
          <div>签名：</div>
          <div class="leader-date">年&emsp;&emsp;月&emsp;&emsp;日</div>
        </td>
      </tr>
    </table>
    <div class="doc-note">注：开会、培训需附通知</div>`;
  return card;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateField(id,field,val){
  const f=forms.find(x=>x.id===id); if(!f) return;
  f[field]=val;
  if(field==='name') sharedName=val;
  saveAll();
}

function toggleTp(id,n){
  const f=forms.find(x=>x.id===id); if(!f) return;
  f.tp=n;
  if(n!==5) f.tpOther='';
  renderPreview();
  saveAll(true);
}

function showIdest(id){
  const el=document.getElementById('idest_'+id);
  if(el) el.style.display='block';
}
function hideIdest(id){
  setTimeout(()=>{
    const el=document.getElementById('idest_'+id);
    if(el) el.style.display='none';
  },180);
}
function pickDest(id,val){
  const f=forms.find(x=>x.id===id); if(!f) return;
  f.dest=val;
  const el=document.getElementById('df_'+id);
  if(el) el.textContent=val;
  hideIdest(id);
  saveAll(true);
}

function setupDrag(){
  if(isMobileView()) return;
  document.querySelectorAll('.form-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragSrc=+card.dataset.idx;
      card.style.opacity='.4';
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>{
      card.style.opacity='1';
      document.querySelectorAll('.form-card').forEach(c=>c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      document.querySelectorAll('.form-card').forEach(c=>c.classList.remove('drag-over'));
      card.classList.add('drag-over');
    });
    card.addEventListener('drop',e=>{
      e.stopPropagation();
      const t=+card.dataset.idx;
      if(dragSrc===t || dragSrc===null) return;
      const mv=forms.splice(dragSrc,1)[0];
      forms.splice(t,0,mv);
      renderPreview();
      saveAll(true);
      dragSrc=null;
    });
  });
}

function exportPDF(){
  if(!forms.length){
    alert('请先添加审批单再导出！');
    return;
  }
  if(isMobileView()) switchMobileView('preview');

  const iframe=document.createElement('iframe');
  iframe.style.cssText='position:fixed;left:-9999px;top:-9999px;width:210mm;height:297mm;border:none;';
  document.body.appendChild(iframe);
  const pagesHtml=document.getElementById('pages-container').innerHTML;

  const printDoc=`<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>

.cut-line-mid::before{content:'✂';position:absolute;top:-9px;left:-0.8cm;font-size:12px;color:#888;background:#fff;padding-right:2px;}

.doc-unit-row{font-size:12pt;font-family:'宋体',SimSun,serif;line-height:1.6;display:flex;justify-content:space-between;align-items:baseline;}
.doc-unit-left{white-space:nowrap;}
.doc-unit-right{white-space:nowrap;font-size:12pt;font-family:'宋体',SimSun,serif;}
.doc-tbl{width:100%;border-collapse:collapse;font-size:12pt;font-family:'宋体',SimSun,serif;table-layout:fixed;margin:0;}
.doc-tbl td{border:1px solid #000;padding:2px 5px;vertical-align:middle;font-size:12pt;font-family:'宋体',SimSun,serif;line-height:1.5;}
.doc-tbl .col-h{width:19.65%;text-align:center;vertical-align:middle;white-space:nowrap;}
.doc-tbl .col-l{text-align:left;vertical-align:middle;}
.doc-tbl .col-c{text-align:center;vertical-align:middle;}
.doc-tbl .leader-cell{vertical-align:top;padding:3px 8px;line-height:2.2;text-align:left;}

.tp-row{display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;font-size:12pt;font-family:'宋体',SimSun,serif;white-space:nowrap;}
.tp-seg{white-space:nowrap;padding:0 1px;}
.other-inline{border:none;border-bottom:1px solid #000;background:transparent;font-size:12pt;font-family:'宋体',SimSun,serif;width:90px;padding:0 2px;vertical-align:middle;}
.other-blank{display:inline-block;width:90px;border-bottom:1px solid #000;vertical-align:middle;margin-left:1px;}
.idest-wrap{position:relative;display:inline;}
.idest-list{display:none!important;}
.doc-note{font-size:12pt;font-family:'宋体',SimSun,serif;line-height:1.6;text-align:left;margin-top:1px;}
[contenteditable]{outline:none;background:transparent!important;}
</style>
</head><body>
<div id="pages-container">${pagesHtml}</div>
</body></html>`;

  iframe.onload=()=>{
    try{
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }catch(e){
      console.error(e);
    }
    setTimeout(()=>{
      if(document.body.contains(iframe)) document.body.removeChild(iframe);
    },3000);
  };
  iframe.srcdoc=printDoc;
}
</script>
